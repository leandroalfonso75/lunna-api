production: &default
  ml_sync_all:
    class: Ml::SyncAllJob
    schedule: every 5 minutes
  olist_sync:
    class: Olist::SyncAllJob
    schedule: every 3 minutes
  olist_refresh:
    class: Olist::RefreshAllJob
    schedule: every 6 hours
  cleanup:
    class: CleanupJob
    schedule: every day at 4am
  # Promoções: a cada hora cheia; cada empresa roda no horário e nos dias que escolheu na tela de Promoções
  promotions_routine:
    class: Ml::PromotionsRoutineJob
    schedule: "0 * * * * America/Sao_Paulo"

development:
  <<: *default
