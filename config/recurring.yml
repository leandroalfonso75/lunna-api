production: &default
  ml_sync_all:
    class: Ml::SyncAllJob
    schedule: every 5 minutes
  olist_sync:
    class: Olist::SyncAllJob
    schedule: every 3 minutes
  # Fichas de produto vindas do ERP: reimporta o que mudou no ERP e importa os novos (migração de 27/11/2026)
  erp_catalog_refresh:
    class: Erp::CatalogRefreshJob
    schedule: every 30 minutes
  olist_refresh:
    class: Olist::RefreshAllJob
    schedule: every 6 hours
  cleanup:
    class: CleanupJob
    schedule: every day at 4am
  # Recomendações de reposição do Full (seção Estoque)
  full_replenishment:
    class: Ml::FullReplenishmentJob
    schedule: every 6 hours
  # Contestações de reclamações escritas com IA a partir do caso inteiro (17/11/2026)
  claim_contest_drafts:
    class: Ml::ClaimContestDraftsJob
    schedule: every hour
  # Notas de devolução do Full em lote (vendas antigas que a consulta por envio não acha), uma vez por dia
  return_invoices_archive:
    class: Ml::ReturnInvoicesArchiveJob
    schedule: every day at 5am
  # Promoções: a cada hora cheia; cada empresa roda no horário e nos dias que escolheu na tela de Promoções
  promotions_routine:
    class: Ml::PromotionsRoutineJob
    schedule: "0 * * * * America/Sao_Paulo"

development:
  <<: *default
