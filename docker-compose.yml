# Ambiente local: Postgres + API + worker do Solid Queue (+ front com --profile web).
#   docker compose up -d                  # postgres, api (:3100), jobs
#   docker compose --profile web up -d    # + lunna-web (:3101), repo irmão em ../lunna-web
# O Postgres não expõe porta no host (5432 costuma estar ocupada por outros projetos).
name: lunna-api

x-app: &app
  build:
    context: .
    target: builder
  env_file:
    - path: .env
      required: false
  environment: &app_env
    RAILS_ENV: development
    DB_HOST: postgres
    DB_USER: postgres
    DB_PASSWORD: postgres
    API_URL: http://localhost:3100
    FRONT_URL: http://localhost:3101
    CORS_ORIGINS: http://localhost:3101
    # Cache do bootsnap dentro de cada container, fora da pasta montada do Windows: api e jobs gravando no mesmo
    # tmp/cache/bootsnap corrompiam o bytecode (quedas com [BUG] Segmentation fault / cfp consistency error e
    # NoMethodError sem sentido dentro do Rails, em 31/10 a 02/11).
    BOOTSNAP_CACHE_DIR: /tmp/bootsnap
  volumes:
    - .:/app
    - gem_cache:/usr/local/bundle
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    # sobe sozinho depois que o computador reinicia (sem isso a API ficava fora do ar; 04 e 05/11/2026)
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"
    restart: unless-stopped
    ports:
      - "3100:3000"

  # bin/jobs-watchdog = bin/jobs + vigia: sem heartbeat de Worker por 5 min, sai com erro e o Docker reinicia.
  jobs:
    <<: *app
    command: bin/jobs-watchdog
    restart: unless-stopped
    # Teste de 02/11: worker com 1 thread para ver se as quedas do Ruby ([BUG] / sinais 6 e 11) param.
    environment:
      <<: *app_env
      JOB_THREADS: "1"

  web:
    profiles: ["web"]
    build:
      context: ${WEB_PATH:-../lunna-web}
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:3100
    ports:
      - "3101:3000"

volumes:
  postgres_data:
  gem_cache:

# Subnet explícita: fora dos pools padrão do Docker, que se esgotam em
# máquinas com muitos projetos compose.
networks:
  default:
    ipam:
      config:
        - subnet: 10.201.0.0/24
