# Um Job por release (nome leva a versão): roda antes de web e jobs subirem com a imagem nova.
apiVersion: batch/v1
kind: Job
metadata:
  name: lunna-api-migrate-0-1-0
  namespace: lunna
  labels: { app: lunna-api, role: migrate }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: lunna-api, role: migrate }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: dockerhub
      containers:
        - name: migrate
          image: vinnialfonso/lunna-api:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          command: ["bundle", "exec", "rails", "db:prepare"]
          envFrom:
            - configMapRef: { name: lunna-api-config }
            - secretRef: { name: lunna-api-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
