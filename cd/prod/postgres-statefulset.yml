apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lunna-postgres
  namespace: lunna
  labels: { app: lunna-postgres, role: postgres }
spec:
  serviceName: lunna-postgres
  replicas: 1
  selector:
    matchLabels: { app: lunna-postgres, role: postgres }
  template:
    metadata:
      labels: { app: lunna-postgres, role: postgres }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: lunna_api }
            - { name: POSTGRES_DB, value: lunna_api_production }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: lunna-api-secrets, key: DATABASE_PASSWORD }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "lunna_api"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "lunna_api"] }
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources: { requests: { storage: 20Gi } }
