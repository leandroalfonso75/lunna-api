# Modelo do Secret da API — NÃO aplique este arquivo.
# Copie para secrets.yml (gitignored), preencha e aplique (ver README.md).
# Nada aqui vai para ConfigMap: tudo que tem senha/chave mora no Secret.
apiVersion: v1
kind: Secret
metadata:
  name: lunna-api-secrets
  namespace: lunna
type: Opaque
stringData:
  # --- banco (Postgres do próprio cluster: postgres-statefulset.yml) ---
  DATABASE_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgres://lunna_api:CHANGE_ME@lunna-postgres:5432/lunna_api_production"

  # --- Rails (gerar do zero: `openssl rand -hex 64` e `openssl rand -base64 32`) ---
  SECRET_KEY_BASE: "CHANGE_ME"
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "CHANGE_ME"
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "CHANGE_ME"
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "CHANGE_ME"

  # --- app do Mercado Livre (DevCenter) — única configuração global do ML ---
  ML_CLIENT_ID: "CHANGE_ME"
  ML_CLIENT_SECRET: "CHANGE_ME"

  # --- Claude API (plano de ação com IA) ---
  ANTHROPIC_API_KEY: "CHANGE_ME"
