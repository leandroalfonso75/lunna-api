# Configuração não secreta da API (web, jobs e job-migrate via envFrom).
# Domínios são placeholders (*.change-me.invalid): trocar antes do primeiro deploy (ver README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunna-api-config
  namespace: lunna
  labels:
    app: lunna-api
data:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "1"
  RAILS_LOG_LEVEL: info
  RAILS_MAX_THREADS: "5"
  # Pool por processo: threads do Puma (5) ou do worker (3) + folga do Solid Queue.
  DB_POOL: "10"
  JOB_CONCURRENCY: "1"
  API_HOST: api.change-me.invalid
  API_URL: https://api.change-me.invalid
  FRONT_URL: https://app.change-me.invalid
  CORS_ORIGINS: https://app.change-me.invalid
  ANTHROPIC_MODEL: claude-opus-5
