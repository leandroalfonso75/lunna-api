# Configuração não secreta da API (web, jobs e job-migrate via envFrom).
# Produção: api.lunnashop.com.br (API) e gestao.lunnashop.com.br (front).
apiVersion: v1
kind: ConfigMap
metadata:
  name: lunna-api-config
  namespace: lunna
  labels:
    app: lunna-api
data:
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "1"
  RAILS_LOG_LEVEL: info
  RAILS_MAX_THREADS: "5"
  # Pool por processo: threads do Puma (5) ou do worker (3) + folga do Solid Queue.
  DB_POOL: "10"
  JOB_CONCURRENCY: "1"
  API_HOST: api.lunnashop.com.br
  API_URL: https://api.lunnashop.com.br
  FRONT_URL: https://gestao.lunnashop.com.br
  CORS_ORIGINS: https://gestao.lunnashop.com.br
